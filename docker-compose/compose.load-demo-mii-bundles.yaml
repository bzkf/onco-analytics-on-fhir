services:
  data-loader:
    image: docker.io/confluentinc/cp-kcat:8.2.4@sha256:1c350ab3a06825d94bd9715e161b0fbc06d884e0e166ecf0a8c80cf9e99c305e
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    privileged: false
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for f in /data/demo-mii-bundles/*.json; do
          echo "$$f"
          tr -d '\n' < "$$f" | kcat -b kafka:9092 -t fhir.obds.bundles -P -k "$$f" -c 1
        done
    volumes:
      - ../tests/fixtures/fhir/:/data/demo-mii-bundles/:ro
    depends_on:
      wait-for-kafka:
        condition: service_completed_successfully

  wait-for-kafka:
    image: ghcr.io/wait4x/wait4x:3.7.2@sha256:2337e64637e1aa9d5d638de6d877914806be6c5156a7221ea40f11911ea4071a
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    privileged: false
    restart: "no"
    command:
      - kafka
      - kafka://kafka:9092
      - --timeout
      - 30s
    depends_on:
      kafka:
        condition: service_started
