services:
  seaweedfs:
    image: ${IMAGE_REGISTRY_DOCKER_IO:-docker.io}/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    ipc: private
    command:
      - mini
      - -dir=/data
      - -master.telemetry=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -admin.user=${AWS_ACCESS_KEY_ID:?}
      - -admin.password=${AWS_SECRET_ACCESS_KEY:?}
    environment:
      # used as the S3 admin identity
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      # buckets created on startup if they don't exist yet
      S3_BUCKET: "fhir,spark-streaming-checkpoints,results"
    volumes:
      - fhir-to-delta-seaweedfs-data:/data:rw
    ports:
      # admin UI
      - "127.0.0.1:23646:23646"
    healthcheck:
      # the S3 /healthz endpoint is ready before the buckets are created, so check the buckets instead
      test:
        - CMD-SHELL
        - |
          for bucket in $$(echo "$$S3_BUCKET" | tr "," " "); do
            curl -sf -o /dev/null -I --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" "http://localhost:8333/$$bucket" || exit 1;
          done
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  kafka-fhir-to-delta:
    image: ${IMAGE_REGISTRY_GHCR_IO:-ghcr.io}/bzkf/fhir-to-lakehouse:v1.13.11@sha256:bc51a5d241e6fb5df82d4f788da06e3f8ff2f1a9b739320fc95f3d27ae43f2fd
    restart: unless-stopped
    cap_drop:
      - ALL
    privileged: false
    ipc: private
    security_opt:
      - "no-new-privileges:true"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPARK_S3_ENDPOINT: seaweedfs:8333
      SPARK_CHECKPOINT_DIR: s3a://spark-streaming-checkpoints/fhir-to-lakehouse
      DELTA_DATABASE_DIR: "s3a://fhir/default"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      KAFKA_TOPICS: ${FHIR_TO_DELTA_KAFKA_TOPICS:?}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-8g}
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:4041:4040"
    volumes:
      - ./spark-defaults.conf:/app/spark/conf/spark-defaults.conf:ro

volumes:
  fhir-to-delta-seaweedfs-data: {}
