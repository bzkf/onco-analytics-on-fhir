name: scheduled

on:
  repository_dispatch: {}
  workflow_dispatch: {}
  schedule:
    - cron: "00 18 * * *"

permissions:
  contents: read

jobs:
  schedule:
    uses: miracum/.github/.github/workflows/standard-schedule.yaml@43926b6aa69b5a63e15378200f698ce8cfeefc88 # v1.29.3
    permissions:
      contents: read
      issues: write
      security-events: write
    with:
      images: "['ghcr.io/bzkf/onco-analytics-on-fhir/analytics-on-fhir:latest', 'ghcr.io/bzkf/onco-analytics-on-fhir/aml-llm-extraction:latest']"
